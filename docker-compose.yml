services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: tickets}
    healthcheck: {test: ["CMD-SHELL","pg_isready -U app -d tickets"], interval: 2s, retries: 20}
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tickets
      REDIS_URL: redis://redis:6379/0
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment: {BACKEND_URL: "http://backend:8000"}
    depends_on: [backend]
    ports: ["3000:3000"]
